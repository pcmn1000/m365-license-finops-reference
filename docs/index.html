<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Microsoft 365 License FinOps の固定データを使った対話型デモレポート">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>M365 License FinOps | Interactive Demo</title>
  <link rel="stylesheet" href="static-demo/powerbi.css">
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="static-demo/data.js"></script>
  <script defer src="static-demo/powerbi.js"></script>
</head>
<body>
  <a class="skip-link" href="#reportCanvas">メイン コンテンツへ移動</a>
  <div class="app-frame">
    <header class="app-header">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true"><i data-lucide="chart-no-axes-combined"></i></span>
        <div>
          <div class="brand-name">M365 License FinOps</div>
          <div class="brand-caption">ライセンス運用ダッシュボード</div>
        </div>
        <span class="snapshot-badge">固定デモ</span>
      </div>
      <div class="header-actions">
        <span class="snapshot-date" id="snapshotLabel"></span>
        <a class="icon-button" href="https://github.com/pcmn1000/m365-license-finops-reference" target="_blank" rel="noreferrer" title="GitHub リポジトリを開く" aria-label="GitHub リポジトリを開く">
          <i data-lucide="github"></i>
        </a>
        <button class="icon-button" id="themeToggle" type="button" title="表示テーマを切り替える" aria-label="表示テーマを切り替える">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <div class="app-shell">
      <nav class="page-nav" aria-label="レポート ページ">
        <button class="nav-item is-active" type="button" data-page="summary" aria-label="エグゼクティブ サマリー" title="エグゼクティブ サマリー">
          <i data-lucide="layout-dashboard"></i><span>エグゼクティブ サマリー</span>
        </button>
        <button class="nav-item" type="button" data-page="department" aria-label="部門比較" title="部門比較">
          <i data-lucide="building-2"></i><span>部門比較</span>
        </button>
        <button class="nav-item" type="button" data-page="features" aria-label="E5機能チェック" title="E5機能チェック">
          <i data-lucide="shield-check"></i><span>E5機能チェック</span>
        </button>
        <button class="nav-item" type="button" data-page="users" aria-label="ユーザー・Copilot詳細" title="ユーザー・Copilot詳細">
          <i data-lucide="users"></i><span>ユーザー・Copilot詳細</span>
        </button>
      </nav>

      <main class="report-area">
        <section class="report-toolbar" aria-label="レポート フィルター">
          <div class="filter-control">
            <label for="licenseFilter">ライセンス</label>
            <select id="licenseFilter"></select>
          </div>
          <div class="filter-control">
            <label for="locationFilter">拠点</label>
            <select id="locationFilter"></select>
          </div>
          <div class="filter-control search-control">
            <label for="userSearch">ユーザー検索</label>
            <div class="input-with-icon">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="userSearch" type="search" autocomplete="off" placeholder="氏名・部門・役職">
            </div>
          </div>
          <button class="icon-button reset-button" id="resetFilters" type="button" title="フィルターをリセット" aria-label="フィルターをリセット">
            <i data-lucide="rotate-ccw"></i>
          </button>
        </section>

        <section class="page-heading">
          <div>
            <p class="eyebrow" id="pageEyebrow">M365 License FinOps</p>
            <h1 id="pageTitle">ライセンス運用サマリー</h1>
          </div>
          <div class="filter-summary" id="filterSummary" aria-live="polite"></div>
        </section>

        <section id="reportCanvas" class="report-canvas" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="detail-drawer" id="detailDrawer" aria-labelledby="drawerTitle" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow" id="drawerKicker"></p>
        <h2 id="drawerTitle">詳細</h2>
      </div>
      <button class="icon-button" id="closeDrawer" type="button" title="詳細を閉じる" aria-label="詳細を閉じる">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="drawer-content" id="drawerContent"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>このレポートを表示するには JavaScript を有効にしてください。</noscript>
</body>
</html>
